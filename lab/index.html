<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiments | AI Team Web Developement</title>
  <link rel="stylesheet" href="../style.css?v=2">
  <link rel="stylesheet" href="lab.css?v=2">
  <script src="matrix/matrix.js" defer></script>
</head>
<body>

  <header class="gallery-header">
    <h1>The Lab</h1>
    <p>Proceed with Caution</p>
  </header>

  <nav class="main-nav">
    <a href="../">Home</a>
    <a href="../gallery/">Gallery</a>
  </nav>

  <main class="gallery-content">
    <h2>Experimental Code</h2>
    <p>Pages in the works...</p>

    <div class="gallery-grid">

      <a href="tools/" class="gallery-link">
        <figure class="gallery-card">
          <img
            src="dev_toolbox.webp"
            alt="Toolbox"
            loading="lazy"
          >
          <figcaption>Toolbox</figcaption>
        </figure>
      </a>
      
      <a href="tesla_coil/" class="gallery-link">
        <figure class="gallery-card">
          <img
            src="tesla_coil/classic_tesla.jpeg"
            alt="About Image"
            loading="lazy"
          >
          <figcaption>Future Tesla Animation</figcaption>
        </figure>
      </a>
        
    </div>

    <!-- Matrix Portal Section -->
    <section class="matrix-selection">
      <div class="matrix-portal">
        <img
          src="matrix/matrix_portal.jpg"
          alt="Matrix Portal Image"
          class="matrix-portal-image"
        >
        <canvas id="matrix-far"></canvas>
        <canvas id="matrix-mid"></canvas>
        <canvas id="matrix-rain"></canvas>

        <a href="matrix/"
          class="enter-matrix"
          aria-label="Enter the Matrix rain screensaver"
        ></a>
      </div>
    </section>
    
  </main>
  
</body>
</html>
