<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Identifier | Young Dev</title>
  <link rel="stylesheet" href="../../../style.css">
  <link rel="stylesheet" href="color_identifier.css">
  <script src="color_identifier.js" defer></script>
</head>

<body>

  <nav class="main-nav">
    <a href="../../../">Home</a>
    <a href="../../">Lab</a>
    <a href="../">Toolbox</a>
  </nav>
  
  <main>
    <h1 class="tool-title">Color Identifier</h1>
    <p class="tool-description">Select an image and tap to sample a color.</p>
    
    <label class="upload-button" for="imageInput">
      Select Image
    </label>
    <input type="file" id="imageInput" accept="image/*">

    <div class="image-area">
      <p id="placeholder">Your image will appear here.</p>
      <canvas id="imageCanvas" hidden></canvas>
    </div>

    <section class="results">
      <div class="swatch-wrap">
        <button id="pickerToggle" type="button"
          aria-label="Open HSV Picker"
          aria-expanded="false"
          aria-controls="hsvPanel">🎨</button>
          
        <div id="swatch"></div>

        <div class="swatch-controls">

          <div class="control-line">
            <label for="alphaSlider">Alpha</label>
            <div class="control-number">
              <input id="alphaPercentInput"
                type="number" min="0" max="100"
                step="0.01" value="100"
                aria-label="Alpha percentage">
              <span>%</span>
            </div>
          </div>
          <input id="alphaSlider" type="range" min="0" max="100" step="0.01" value="100">

          <div class="control-line">
            <label for="stripeAngleSlider">Angle</label>
            <div class="control-number">
              <input id="stripeAngleInput"
                type="number" min="0" max="360"
                step="0.1" value="0"
                aria-label="Background angle">
              <span>°</span>
            </div>
          </div>
          <input id="stripeAngleSlider" type="range" min="0" max="360" step="0.1" value="0">

        </div>
      </div>

      <div class="values">

        <div class="value-row">
          <label for="hexValue">HEX:</label>
          <input type="text" id="hexValue" value="#000000" maxlength="9" spellcheck="false">
          <button id="copyHexButton" disabled>Copy HEX</button>
        </div>

        <div class="value-row">
          <label for="rgbValue">RGB:</label>
          <input type="text" id="rgbValue" value="0, 0, 0" spellcheck="false">
          <button id="copyRgbButton" disabled>Copy RGB</button>
        </div>

        <div class="value-row">
          <label for="hsvValue">HSV:</label>
          <input type="text" id="hsvValue" value="0, 0, 0" spellcheck="false">
          <button id="copyHsvButton" disabled>Copy HSV</button>
        </div>

        <div class="value-row">
          <label for="hslValue">HSL:</label>
          <input type="text" id="hslValue" value="0, 0, 0" spellcheck="false">
          <button id="copyHslButton" disabled>Copy HSL</button>
        </div>

        <div class="gradient-add-actions">
          <button id="addGradientColorButton" type="button" aria-controls="gradientBuilder">
            + Add Color to Gradient
          </button>
        </div>

      </div>
    </section>

    <section id="gradientBuilder" class="gradient-builder"
      aria-labelledby="gradientBuilderHeading" hidden>
      <h2 id="gradientBuilderHeading">Gradient Builder</h2>

      <div class="gradient-builder-body">
        <div class="gradient-preview-controls">
          <div id="gradientPreview" aria-hidden="true"></div>

          <div class="control-line">
            <label for="gradientAngleSlider">Angle</label>
            <div class="control-number">
              <input id="gradientAngleInput" type="number"
                min="0" max="360" step="0.1" value="90"
                aria-label="Gradient angle">
              <span>°</span>
            </div>
          </div>

          <input id="gradientAngleSlider" type="range"
            min="0" max="360" step="0.1" value="90">
        </div>

        <ul id="gradientStopList" role="list" aria-label="Saved gradient colors"></ul>
      </div>

      <div class="gradient-output">
        <label for="gradientCss">Gradient CSS</label>
        <div class="gradient-output-row">
          <input id="gradientCss" type="text" readonly
            placeholder="Add 2 or more colors to build a gradient">
          <button id="copyGradientButton" type="button" disabled>Copy CSS</button>
        </div>
      </div>
    </section>
    
  </main>

  <!-- Floating HSV color Picker -->
  <div id="hsvPanel" hidden>
    <div class="picker-header">
      <strong>HSV Color Picker</strong>
      <button id="pickerClose" type="button" aria-label="Close HSV Picker">x</button>
    </div>

    <div id="svSquare">
      <div id="svCursor"></div>
    </div>

    <label for="hueSlider">Hue</label>
    <input id="hueSlider" type="range" min="0" max="359" value="180">
  </div>

  <!-- Magnifier loupe -->
  <div id="loupe" hidden>
    <canvas id="loupeCanvas" width="120" height="120"></canvas>
    <div class="center-dot"></div>
  </div>

</body>
