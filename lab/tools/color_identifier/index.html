<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Identifier | Young Dev</title>
  <link rel="stylesheet" href="../../../style.css">
  <link rel="stylesheet" href="color_identifier.css">
  <script src="color_identifier.js" defer></script>
</head>

<body>

  <nav class="main-nav">
    <a href="../../../">Home</a>
    <a href="../../">Lab</a>
    <a href="../">Toolbox</a>
  </nav>
  
  <main>
    <h1 class="tool-title">Color Identifier</h1>
    <p class="tool-description">Select an image and tap to sample a color.</p>
    
    <label class="upload-button" for="imageInput">
      Select Image
    </label>
    <input type="file" id="imageInput" accept="image/*">

    <div class="image-area">
      <p id="placeholder">Your image will appear here.</p>
      <canvas id="imageCanvas" hidden></canvas>
    </div>

    <section class="results">
      <div id="swatch"></div>

      <div class="values">
        <div class="value-row">
          <label for="hexValue">HEX:</label>
          <input type="text" id="hexValue" value="#000000" maxlength="7" spellcheck="false">
          <button id="copyHexButton" disabled>Copy HEX</button>
        </div>
        <div class="value-row">
          <label for="rgbValue">RGB:</label>
          <input type="text" id="rgbValue" value="0, 0, 0" spellcheck="false">
          <button id="copyRgbButton" disabled>Copy RGB</button>
        </div>
      </div>
    </section>
    
  </main>

  <div id="loupe" hidden>
    <canvas id="loupeCanvas" width="120" height="120"></canvas>
    <div class="center-dot"></div>
  </div>

</body>
