<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Coordinate Mapper | Young Dev</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="tool-coordinates.css">
  <script src="tool-coordinates.js" defer></script>
</head>

<body>
  
  <nav class="main-nav">
    <a href="../../">Home</a>
  </nav>

  <main class="coordinate-tool">
    <h1>Image Coordinates Mapper</h1>
    <p>Choose an image from your device.  Your image is stored only in your local browser.  Only one image is stored at a time.</p>

    <label for="image-file">Select an image:</label>
    <input type="file" id="image-file" accept="image/">

    <p id="image-details" role="status">No image selected.</p>

    <div id="image-stage" hidden>
      <img id="image-preview" alt="Preview of your image"
    </div>
  </main>
  
</body>
</html>
