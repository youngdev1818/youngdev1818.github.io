<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Evolution | AI Team</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="Gallery/Portal/Gallery-Portal.css?v=2">
</head>

<body>
  <header class="gallery-header">
    <h1>Through the Teal Portal</h1>
    <p>From imagination to creation</p>
  </header>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="Gallery.html">Gallery</a>
  </nav>

  <main class="gallery-content">
    <h2>The Making of a Portal</h2>
    <p>A journey through AI-generated artwork, collaboration, and web design.</p>

    <div class="gallery-grid">
      
      <!-- Dog Slideshow -->
      <figure class="gallery-card">
        <div class="slideshow">
          <div class="slide-evo-dog">
            <img src="Gallery/Portal/grok_dog_raw.jpg"
              alt="Grok Dog Sphinx - Raw">
            <span class="slide-caption">Raw</span>
          </div>
          <div class="slide-evo-dog">
            <img src="Gallery/Portal/grok_dog_fin.jpg"
              alt="Grok Dog Sphinx - Reversed">
            <span class="slide-caption">Reversed</span>
          </div>
        </div>
        <figcaption>Grok Dog Sphinx</figcaption>
      </figure>

      <!-- Original Portal -->
      <figure class="gallery-card">
        <img src="Gallery/Portal/grok_portal.jpg"
          alt="Grok Portal">
        <figcaption>Original Portal Idea - Grok</figcaption>
      </figure>

      <!-- Cat Slideshow -->
      <figure class="gallery-card">
        <div class="slideshow">
          <div class="slide-evo-cat">
            <img src="Gallery/Portal/grok_cat_raw.jpg"
              alt="Grok Cat Sphinx - Raw">
            <span class="slide-caption">Raw</span>
          </div>
          <div class="slide-evo-cat">
            <img src="Gallery/Portal/grok_cat_fin.jpg"
              alt="Grok Cat Sphinx - Refined">
            <span class="slide-caption">Refined</span>
          </div>
        </div>
        <figcaption>Grok Cat Sphinx</figcaption>
      </figure>

      <!-- Portal Evolution Slideshow -->
      <figure class="gallery-card">
        <div class="slideshow">
          <div class="slide-evo-gens">
            <img src="Gallery/Portal/Evo-Gensss/dev-gensss1.jpg"
              alt="Original Assembly">
            <span class="slide-caption">Original Assembly</span>
          </div>
          <div class="slide-evo-gens">
            <img src="Gallery/Portal/Evo-Gensss/dev-gensss2.jpg"
              alt="Phase 2">
            <span class="slide-caption">Phase 2</span>
          </div>
          <div class="slide-evo-gens">
            <img src="Gallery/Portal/Evo-Gensss/dev-gensss3.jpg"
              alt="Phase 3">
            <span class="slide-caption">Phase 3</span>
          </div>
          <div class="slide-evo-gens">
            <img src="Gallery/Portal/Evo-Gensss/dev-gensss4.jpg"
              alt="Phase 4">
            <span class="slide-caption">Phase 4</span>
          </div>
          <div class="slide-evo-gens">
            <img src="Gallery/Portal/Evo-Gensss/dev-gensss5.jpg"
              alt="Phase 5">
            <span class="slide-caption">Phase 5</span>
          </div>
          <div class="slide-evo-gens">
            <img src="Gallery/Portal/Evo-Gensss/dev-gensss6.jpg"
              alt="Phase 6">
            <span class="slide-caption">Phase 6</span>
          </div>
        </div>
        <figcaption>Temple Evolution - Genspark</figcaption>
      </figure>
      <!-- Temple Evolution Lightbox -->
      <dialog id="temple-lightbox" class ="lightbox">
        <div class="lightbox-content">
          <button class="lightbox-close" type="button" aria-label="Close Gallery">
            &times;
          </button>
          <h2>Temple Evolution - Genspark</h2>
          <div class="lightbox-viewer">
            <button class="lightbox-prev" type="button" aria-label="Previous Image">
              &#10094;
            </button>
            <img id="lightbox-image" alt="Temple Evolution Artwork">
            <button class="lightbox-next" type="button" aria-label="Next Image">
              &#10095;
            </button>
          </div>
          <p id="lightbox-caption"></p>
          <div id="lightbox-dots" class="lightbox-dots"></div>
        </div>
      </dialog>
      
    </div>
  </main>
<script src="Gallery/Portal/Portal-LB.js"></script>
</body>
</html>
