<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Team Web Developer</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero">
    <img
      src="home/dev_hero_banner.jpg"
      alt="Egyptian Temple with Portal - wide"
      class="hero-image"
    >
      
    <div class="hero-title">
      <h1>AI Team Web Developer</h1>
      <p>Building Next-Gen Intelligent Web Solutions</p>
    </div>
  </header>

  <nav class="main-nav">
    <a href="gallery/">Gallery</a>
    <a href="Happy_Birthday_Dad/">Happy Birthday Dad!</a>
    <a href="lab/">The Lab</a>
  </nav>

  <main>
    <!-- Matrix Portal Section -->
    <section class="matrix-selection">
      <div class="matrix-portal">
        <img
          src="matrix/matrix_portal.jpg"
          alt="Matrix Portal Image"
          class="matrix-portal-image"
        >
        <canvas id="matrix-far"></canvas>
        <canvas id="matrix-mid"></canvas>
        <canvas id="matrix-rain"></canvas>

        <a href="matrix/"
          class="enter-matrix"
          aria-label="Enter the Matrix rain screensaver"
        ></a>
      </div>
    </section>
  </main>

<script src="matrix/matrix-layers.js"></script>
</body>
</html>
