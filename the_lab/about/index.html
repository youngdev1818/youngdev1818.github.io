<!DOCTYPE html>

  <nav class="main-nav" aria-label="Main navigation">

  <main>
    <section class="about-scene" aria-labelledby="about-heading">
      <img
        class="about-art"
        src="dev_about_builder.webp"
        width="1536"
        height="1024"
        alt="A robed developer uses a glowing tablet to assemble architectural blocks of code inside an ornate hall."

      <!-- Each polygon is drawn in the image's original 1536 x 1024 coordinates. -->
      <svg class="holo-waves" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true">
        <polygon class="holo-wave wave-one" points="843,277 842,673 585,954 585,70"/>
        <polygon class="holo-wave wave-two" points="1389,230 843,277 585,70 1456,70"/>
        <polygon class="holo-wave wave-three" points="1391,687 1389,230 1456,70 1456,954"/>
      </svg>

      <div class="about-display">
        <p class="eyebrow">THE BUILDER BEHIND THE CODE</p>
        <h1 id="about-heading">About Young Dev</h1>
        <p>I learn by building—turning curiosity into useful websites, interactive experiments, and ideas made real.</p>
        <p class="eyebrow">Learn to create, create to learn.</p>
      </div>

      <p class="projection-message">Imagine <span aria-hidden="true">✦</span> Build <span aria-hidden="true">✦</span> Refine</p>
